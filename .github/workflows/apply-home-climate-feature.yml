name: Apply home climate feature

on:
  push:
    branches:
      - tmp/apply-home-climate-feature-2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tmp/apply-home-climate-feature-2
          fetch-depth: 0

      - name: Preserve helper script
        run: cp scripts/apply-home-climate-feature-v3.mjs /tmp/apply-home-climate-feature-v3.mjs

      - name: Checkout feature branch
        run: |
          git fetch origin feature/home-climate-sensor-selection
          git checkout feature/home-climate-sensor-selection
          git reset --hard origin/feature/home-climate-sensor-selection

      - name: Apply feature patch
        run: node /tmp/apply-home-climate-feature-v3.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/strategy.ts src/utils/area.ts src/components/dwains-dashboard-strategy-editor.ts src/components/dwains-layout-card.ts src/i18n/locales/en.ts src/i18n/locales/de.ts
          git commit -m "Add configurable room climate sensors"
          git push origin HEAD:feature/home-climate-sensor-selection
