name: Apply German translation cleanup

on:
  push:
    branches:
      - fix/german-translations

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/german-translations
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply translation cleanup
        run: node scripts/apply-german-translation-fix.mjs
      - name: Remove temporary patch files
        run: |
          rm scripts/apply-german-translation-fix.mjs
          rm .github/workflows/apply-german-translation-fix.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/locales/de.ts
          git rm scripts/apply-german-translation-fix.mjs .github/workflows/apply-german-translation-fix.yml
          git commit -m "Improve German translations"
          git push
