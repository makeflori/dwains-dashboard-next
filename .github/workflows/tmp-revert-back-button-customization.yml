name: Temp revert dashboard Back button customization

on:
  push:
    branches:
      - fix/revert-dashboard-back-button-customization

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove all Back/Cancel overrides
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/dwains-dashboard-strategy-editor.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  private _hostDialogObserver?: MutationObserver;\n', '')
          s = re.sub(
              r"\n  private _installHostDialogCancelLabel\(attempt = 0\): void \{.*?\n  \}\n\n  private _getDashboardUrlPath",
              '\n  private _getDashboardUrlPath',
              s,
              count=1,
              flags=re.S,
          )
          s = s.replace('    queueMicrotask(() => this._installHostDialogCancelLabel());\n', '')
          s = re.sub(
              r"\n  disconnectedCallback\(\) \{\n    this\._hostDialogObserver\?\.disconnect\(\);\n    this\._hostDialogObserver = undefined;\n    super\.disconnectedCallback\(\);\n  \}\n",
              '\n',
              s,
              count=1,
          )
          p.write_text(s, encoding='utf-8')

          idx = Path('src/index.ts')
          i = idx.read_text(encoding='utf-8')
          i = i.replace("import { installDashboardStrategyDialogLocalization } from './utils/dashboard-strategy-dialog-localization';\n", '')
          i = i.replace('installDashboardStrategyDialogLocalization();\n', '')
          idx.write_text(i, encoding='utf-8')
          PY

          rm -f src/utils/dashboard-strategy-dialog-localization.ts

          npm ci
          npm run type-check
          npm run build

          git add src/components/dwains-dashboard-strategy-editor.ts src/index.ts src/utils/dashboard-strategy-dialog-localization.ts dist/dwains-dashboard-next.js
          git commit -m "revert: remove dashboard Back button customization"
          git push origin HEAD:fix/revert-dashboard-back-button-customization
