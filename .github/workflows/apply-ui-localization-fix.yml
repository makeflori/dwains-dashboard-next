name: Apply UI localization and formatting fix

on:
  push:
    branches:
      - fix/ui-localization-and-formatting

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-localization-and-formatting
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply UI fixes
        run: node scripts/apply-ui-localization-fix.mjs
      - name: Type check
        run: npm run type-check
      - name: Remove temporary patch files
        run: |
          rm scripts/apply-ui-localization-fix.mjs
          rm .github/workflows/apply-ui-localization-fix.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dwains-layout-card.ts
          git rm scripts/apply-ui-localization-fix.mjs .github/workflows/apply-ui-localization-fix.yml
          git commit -m "Localize UI labels and normalize formatting"
          git push
