name: Apply home settings section details

on:
  push:
    branches:
      - tmp/home-settings-section-details

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tmp/home-settings-section-details
          fetch-depth: 0

      - name: Preserve helper
        run: cp scripts/apply-home-settings-section-details.mjs /tmp/apply-home-settings-section-details.mjs

      - name: Checkout feature branch
        run: |
          git fetch origin feature/home-settings-section-details
          git checkout feature/home-settings-section-details
          git reset --hard origin/feature/home-settings-section-details

      - name: Apply refactor
        run: node /tmp/apply-home-settings-section-details.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dwains-dashboard-strategy-editor.ts
          git commit -m "Refactor start page settings into section details"
          git push origin HEAD:feature/home-settings-section-details
