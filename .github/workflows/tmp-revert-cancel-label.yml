name: Temp revert dashboard cancel label

on:
  push:
    branches:
      - fix/revert-dashboard-cancel-label

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert cancel-label experiments on dev fix branch and upstream PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/revert-dashboard-cancel-label fix/ui-localization-and-formatting

          rollback_branch() {
            branch="$1"
            git checkout -B "$branch" "origin/$branch"
            python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/dwains-dashboard-strategy-editor.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  private _hostDialogObserver?: MutationObserver;\n', '')
          s = re.sub(
              r"\n  private _installHostDialogCancelLabel\(attempt = 0\): void \{.*?\n  \}\n\n  private _getDashboardUrlPath",
              '\n  private _getDashboardUrlPath',
              s,
              count=1,
              flags=re.S,
          )
          s = s.replace('    queueMicrotask(() => this._installHostDialogCancelLabel());\n', '')
          s = re.sub(
              r"\n  disconnectedCallback\(\) \{\n    this\._hostDialogObserver\?\.disconnect\(\);\n    this\._hostDialogObserver = undefined;\n    super\.disconnectedCallback\(\);\n  \}\n",
              '\n',
              s,
              count=1,
          )
          p.write_text(s, encoding='utf-8')

          idx = Path('src/index.ts')
          t = idx.read_text(encoding='utf-8')
          t = t.replace("import { installDashboardStrategyDialogLocalization } from './utils/dashboard-strategy-dialog-localization';\n", '')
          t = t.replace('installDashboardStrategyDialogLocalization();\n', '')
          idx.write_text(t, encoding='utf-8')

          util = Path('src/utils/dashboard-strategy-dialog-localization.ts')
          if util.exists():
              util.unlink()
          PY
            npm ci
            npm run type-check
            git add -A src/components/dwains-dashboard-strategy-editor.ts src/index.ts src/utils/dashboard-strategy-dialog-localization.ts
            if ! git diff --cached --quiet; then
              git commit -m "revert: remove dashboard cancel-label override"
              git push origin "HEAD:$branch"
            fi
          }

          rollback_branch fix/revert-dashboard-cancel-label
          rollback_branch fix/ui-localization-and-formatting

      - name: Done
        run: echo rollback-complete
