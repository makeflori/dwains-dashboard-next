name: Apply dev release automation

on:
  push:
    paths:
      - '.github/workflows/apply-dev-release-automation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/sync-dev-version.mjs
      - run: npm run type-check
      - name: Commit synced dev release metadata
        run: |
          rm -f scripts/sync-dev-version.mjs .github/workflows/apply-dev-release-automation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json README.md .github/workflows/dev-release.yml scripts/sync-dev-version.mjs .github/workflows/apply-dev-release-automation.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automate versioned dev prereleases"
          git push origin HEAD:dev
