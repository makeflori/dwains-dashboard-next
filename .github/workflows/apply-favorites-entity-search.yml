name: Apply favorites entity search fix
on:
  push:
    branches:
      - tmp/fix-favorites-entity-search
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/apply-favorites-entity-search.mjs
      - run: npm run type-check
      - name: Commit result
        run: |
          rm scripts/apply-favorites-entity-search.mjs
          rm .github/workflows/apply-favorites-entity-search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dwains-dashboard-strategy-editor.ts scripts/apply-favorites-entity-search.mjs .github/workflows/apply-favorites-entity-search.yml
          git commit -m "Restore favorites entity search field"
          git push
