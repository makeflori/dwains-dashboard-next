name: Apply remaining UI localization fixes

on:
  push:
    branches:
      - fix/ui-localization-and-formatting
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix
        run: node scripts/apply-remaining-localization-fix.mjs

      - name: Type check
        run: |
          npm ci
          npm run type-check

      - name: Clean helper files and commit
        run: |
          rm scripts/apply-remaining-localization-fix.mjs
          rm .github/workflows/apply-remaining-localization-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Localize remaining dashboard labels"
          git push
