name: Dev Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Read development version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            echo "Current version $VERSION is not a dev version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure build commit is current
        shell: bash
        run: |
          HEAD_MESSAGE=$(git log -1 --pretty=%s)
          if [[ "$HEAD_MESSAGE" != "Build dev bundle" ]]; then
            echo "Current dev HEAD is not the finished bundle commit: $HEAD_MESSAGE"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes "Development build $VERSION."
