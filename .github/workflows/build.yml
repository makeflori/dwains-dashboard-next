name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply unit spacing patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/ui-localization-and-formatting'
        run: node scripts/apply-unit-spacing-fix.mjs

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Commit unit spacing patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/ui-localization-and-formatting'
        run: |
          if git diff --quiet -- src/components/dwains-layout-card.ts; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dwains-layout-card.ts
          git commit -m "Normalize remaining temperature unit spacing"
          git push
