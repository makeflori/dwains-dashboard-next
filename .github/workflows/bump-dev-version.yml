name: Bump Dev Version

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Increment dev version
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-dev\.([0-9]+)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            NEXT_NUM=$((BASH_REMATCH[2] + 1))
          else
            echo "Current version $CURRENT is not in x.y.z-dev.N format."
            exit 1
          fi
          NEXT="$BASE-dev.$NEXT_NUM"
          npm version "$NEXT" --no-git-tag-version
          node -e "const fs=require('fs');const p='README.md';let s=fs.readFileSync(p,'utf8');s=s.replace(/Development version: `[^`]+`/, 'Development version: `'+process.argv[1]+'`');fs.writeFileSync(p,s);" "$NEXT"
          echo "Bumped $CURRENT -> $NEXT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md
          git commit -m "Bump dev version"
          git push origin HEAD:dev
