name: Apply strategy bootstrap fix

on:
  push:
    branches:
      - tmp/strategy-bootstrap-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tmp/strategy-bootstrap-fix

      - name: Preserve helper
        run: cp scripts/apply-strategy-bootstrap-fix.mjs /tmp/apply-strategy-bootstrap-fix.mjs

      - name: Checkout fix branch
        run: |
          git fetch origin fix/strategy-registration-bootstrap
          git checkout fix/strategy-registration-bootstrap

      - name: Apply fix
        run: node /tmp/apply-strategy-bootstrap-fix.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts src/strategies/dashboard-strategy.ts src/strategies/view-strategy.ts
          git commit -m "Make strategy registration resilient"
          git push origin fix/strategy-registration-bootstrap
