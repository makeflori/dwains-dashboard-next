name: Publish customized v1.15.1
on:
  push:
    branches: [automation/publish-v1.15.1]
    paths: [.github/workflows/publish-v1.15.1.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build:release
      - name: Publish release from verified dev
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8c831dd355a0ff2b53abbfebfb13f5a01ffb71f6"
          test "$(node -p "require('./package.json').version")" = "1.15.1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dist
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh v1.15.1 custom assets"
            git push origin HEAD:refs/heads/dev
          fi
          if gh release view v1.15.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v1.15.1 already exists"
            exit 1
          fi
          gh release create v1.15.1 --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "v1.15.1 (angepasster Fork)" --notes "Dwains Dashboard Next v1.15.1 mit migrierten individuellen Anpassungen aus dev. TypeScript, Übersetzungen, Tests und Build geprüft. main bleibt das unveränderte Upstream-Original. Anzeige und Funktionen in Home Assistant bitte zusätzlich prüfen." --latest
