name: Apply unit spacing fix

on:
  push:
    paths:
      - scripts/apply-unit-spacing-fix.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-unit-spacing-fix.mjs
      - run: npm run type-check
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dwains-layout-card.ts
          git commit -m "Normalize remaining temperature unit spacing"
          git push
