name: Apply dev prerelease version

on:
  push:
    branches:
      - tmp/dev-version-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply development version
        run: node scripts/apply-dev-version-release.mjs

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Commit development version
        id: commit
        run: |
          rm scripts/apply-dev-version-release.mjs
          rm .github/workflows/apply-dev-version-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md dist/dwains-dashboard-next.js
          git add -u scripts .github/workflows
          git commit -m "Set development version 1.8.1-dev.1"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.8.1-dev.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.commit.outputs.sha }}" \
            --title "v1.8.1-dev.1" \
            --notes "Development prerelease for testing the current dev branch through HACS/Home Assistant." \
            --prerelease
