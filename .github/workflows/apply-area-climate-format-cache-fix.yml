name: Apply area climate format cache fix

on:
  push:
    branches:
      - tmp/fix-area-climate-format-cache

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tmp/fix-area-climate-format-cache
          fetch-depth: 0

      - name: Preserve helper script
        run: cp scripts/fix-area-climate-format-cache.mjs /tmp/fix-area-climate-format-cache.mjs

      - name: Checkout fix branch
        run: |
          git fetch origin fix/area-climate-format-cache
          git checkout fix/area-climate-format-cache
          git reset --hard origin/fix/area-climate-format-cache

      - name: Apply fix
        run: node /tmp/fix-area-climate-format-cache.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dwains-layout-card.ts
          git commit -m "Refresh area climate formatting outside cache"
          git push origin HEAD:fix/area-climate-format-cache
