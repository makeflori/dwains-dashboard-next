name: Apply HA display metadata fix

on:
  push:
    branches:
      - tmp/fix-preserve-ha-display-metadata

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: tmp/fix-preserve-ha-display-metadata
          fetch-depth: 0

      - name: Preserve helper
        run: cp scripts/fix-preserve-ha-display-metadata.mjs /tmp/fix-preserve-ha-display-metadata.mjs

      - name: Checkout fix branch
        run: |
          git fetch origin fix/preserve-ha-entity-display-metadata
          git checkout fix/preserve-ha-entity-display-metadata
          git reset --hard origin/fix/preserve-ha-entity-display-metadata

      - name: Apply fix
        run: node /tmp/fix-preserve-ha-display-metadata.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dwains-dashboard-strategy-editor.ts src/components/dwains-layout-card.ts
          git commit -m "Preserve Home Assistant entity display metadata"
          git push origin HEAD:fix/preserve-ha-entity-display-metadata
