name: Diagnose retained legacy components against 1.15.1
on:
  push:
    branches: [migration/replay-on-v1.15.1]
    paths: [.github/workflows/port-legacy-v1151.yml, scripts/port-legacy-v1151.mjs]
permissions:
  contents: write
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/replay-on-v1.15.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Adapt old core components using updated dependencies
        run: node scripts/port-legacy-v1151.mjs
      - name: Checkout companion Blueprint repository for integration tests
        run: git clone --depth=1 --quiet https://github.com/makeflori/dwains-dashboard-blueprints.git blueprint-source
      - name: Run all unit tests
        run: npm test
      - name: Build migrated source
        run: npm run build
      - name: Save compiled, validated migration candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src tests dist
          git commit -m "Port customized room, devices, settings and tablet components to v1.15.1"
          git push origin HEAD:refs/heads/migration/replay-on-v1.15.1
